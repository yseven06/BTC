name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck · lint · design-gates · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Design gates (strict)
        run: npm run lint:design:strict

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  backend:
    name: Backend (pytest · test database enforced)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway database is provisioned deliberately. The suite is unit tests
    # today and needs no connection, but backend/conftest.py REFUSES to run in CI
    # without a DATABASE_URL pointing at a test database — so the day someone adds
    # a DB-backed test, CI already has a safe target instead of reaching for
    # whatever DSN happens to be in the environment.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zatetrade_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Local, and named 'test' — the two things conftest.py accepts.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/zatetrade_test
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock

      - name: Install
        run: pip install -r requirements.lock

      - name: Test-safety guard is armed
        # Proves the guard would actually stop a production DSN, in CI, before
        # trusting the suite below. Expected to FAIL the pytest run — the step
        # passes only when it does.
        run: |
          set -e
          if DATABASE_URL='postgresql+asyncpg://u:p@aws-1-us-east-1.pooler.supabase.com:5432/postgres' \
             python -m pytest tests -q >/dev/null 2>&1; then
            echo "::error::conftest guard did not block a production-shaped DSN"
            exit 1
          fi
          echo "Guard blocked the production-shaped DSN."

      - name: Test
        run: python -m pytest tests app/trade_mgmt/tests -q

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for common secret patterns
        run: |
          set -e
          PATTERNS='(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16}|eyJhbGciOi[A-Za-z0-9_.-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          if grep -rEn "$PATTERNS" \
              --include='*.ts' --include='*.tsx' \
              --include='*.js'  --include='*.jsx' --include='*.mjs' --include='*.cjs' \
              --include='*.py' \
              --include='*.json' --include='*.yml' --include='*.yaml' \
              --include='*.env*' \
              --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git --exclude-dir=dist --exclude-dir=build \
              .; then
            echo "::error::Potential secret detected in tracked files."
            exit 1
          fi
          echo "No secret patterns found."
